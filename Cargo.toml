[workspace]
members = [".", "capsule-macros"]
resolver = "2"

[package]
name = "capsule"
version = "0.7.0"
edition = "2021"

[[bin]]
name = "capsule"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
ctrlc = { version = "3", features = ["termination"] }
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = { version = "0.28", default-features = false }

[workspace.metadata.release]
allow-branch = ["main"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serial_test = "3"
capsule-macros = { path = "capsule-macros" }
